[versions]
kotlin = "2.2.10"
room = "2.7.2"
retrofit = "3.0.0"
moshi = "1.15.2"
compose = "1.9.0"
compose-m3 = "1.3.2"
compose-m3-adaptive = "1.1.0"
compose-navigation = "2.9.3"
compose-runtime = "2.9.2"
accompanist = "0.36.0"
hilt = "2.57"
hilt-navigation = "1.2.0"
jupiter = "5.13.4"
mockk = "1.14.5"
turbine = "1.2.1"
kotlin-coroutines = "1.10.2"
google-services = "4.4.3"
gradle = "8.12.0"
ksp = "2.2.10-2.0.2"
work-runtime-ktx = "2.10.3"
work-hilt = "1.2.0"
app-compat = "1.7.1"
ok-http = "5.1.0"
timber = "5.0.1"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "app-compat" }

androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-ui-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
androidx-compose-ui-m3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-m3" }
androidx-compose-ui-m3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "compose-m3-adaptive" }
androidx-compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "compose-navigation" }
androidx-compose-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "compose-runtime" }

androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
androidx-compose-ui-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }

androidx-accompanist-webview = { group = "com.google.accompanist", name = "accompanist-webview", version.ref = "accompanist" }
androidx-accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }

androidx-work-manager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work-runtime-ktx" }
androidx-work-manager-hilt = { group = "androidx.hilt", name = "hilt-work", version.ref = "work-hilt" }

kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlin-coroutines" }

retrofit-okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "ok-http" }
retrofit-convertor-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
retrofit-lib = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-moshi-kotlin = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
retrofit-moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

junit-test = { group = "junit", name = "junit", version = "4.13.2" }
jupiter-test = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "jupiter" }
mockk-test = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine-test = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }

google-dagger-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
google-dagger-hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation" }

google-gms-services = { group = "com.google.gms", name = "google-services", version.ref = "google-services" }
google-tools-gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "gradle" }

timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

[plugins]
com-google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
com-google-dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
org-jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
org-jetbrains-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
org-jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
androidx-room = [
    "androidx-room-runtime",
    "androidx-room-ktx"
]

androidx-compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-preview",
    "androidx-compose-ui-m3",
    "androidx-compose-navigation",
    "androidx-compose-ui-m3-adaptive",
    "androidx-compose-runtime"
]

androidx-compose-tooling = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-manifest"
]

androidx-accompainst = [
    "androidx-accompanist-webview",
    "androidx-accompanist-permissions"
]

androidx-work-manager = [
    "androidx-work-manager",
    "androidx-work-manager-hilt"
]

retrofit = [
    "retrofit-okhttp",
    "retrofit-convertor-gson",
    "retrofit-lib",
    "retrofit-moshi-kotlin"
]

unit-test = [
    "junit-test",
    "jupiter-test",
    "mockk-test",
    "turbine-test",
    "coroutines-test"
]

hilt = [
    "google-dagger-hilt-android",
    "androidx-hilt-navigation-compose"
]
