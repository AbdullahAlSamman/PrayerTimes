compose-m3-adaptive = "1.2.0"
compose-m3-window-size = "1.4.0"
compose-runtime = "2.11.0"
compose-core = "1.7.8"
accompanist = "0.37.3"
hilt = "2.60.1"
hilt-navigation = "1.4.0"
jupiter = "6.1.3"
mockk = "1.14.11"
turbine = "1.2.1"
