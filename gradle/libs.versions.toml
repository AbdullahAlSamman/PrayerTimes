google-dagger-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
google-dagger-hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation" }

timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

kotlinMetadataJvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }

androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }

play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "play-services" }
play-ump-consent = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump-consent" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
com-google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
com-google-dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
org-jetbrains-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
org-jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-gms-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlaytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin"}

[bundles]
androidx-room = [
    "androidx-room-runtime",
    "androidx-room-ktx"
]

androidx-compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-preview",
    "androidx-compose-ui-m3",
    "androidx-compose-ui-m3-adaptive",
    "androidx-compose-m3-windowsize",
    "androidx-compose-ui-m3-core",
    "androidx-compose-runtime"
]

androidx-navigation3 = [
    "androidx-navigation3-runtime",
    "androidx-navigation3-ui"
]

androidx-compose-tooling = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-manifest"
]

androidx-accompainst = [
    "androidx-accompanist-permissions"
]

androidx-work-manager = [
    "androidx-work-manager",
    "androidx-work-manager-hilt"
]

retrofit = [
    "retrofit-okhttp",
    "retrofit-convertor-gson",
    "retrofit-lib",
    "retrofit-moshi-kotlin"
]

unit-test = [
    "junit-test",
    "jupiter-test",
    "jupiter-engine",
    "jupiter-params",
    "jupiter-launcher",
    "jupiter-vintage",
    "mockk-test",
    "turbine-test",
    "coroutines-test"
]

hilt = [
    "google-dagger-hilt-android",
    "androidx-hilt-navigation-compose"
]

kotlinx = [
    "kotlinx-coroutines",
    "kotlinx-serialization-json",
    "kotlinx-collections-immutable"
]

play-services = [
    "play-services-ads",
    "play-ump-consent"
]

firebase-services = [
    "firebase-analytics",
    "firebase-crashlytics"
]

glance = [
    "androidx-glance-appwidget"
]
