name: Build App release or debug
on:
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type"
        required: true
        default: "Debug"
        options:
          - Release
          - Debug
      versionName:
        type: string
        description: "=========== Release Only =========== Version name"
        required: true
        default: "1.0.8"
      buildApk:
        type: boolean
        description: "APK"
        required: true
        default: false
      buildBundle:
        type: boolean
        description: "Bundle"
        required: true
        default: true

jobs:
  debug_app_packages:
    if: ${{ github.event.inputs.buildType == 'Debug' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Build debug apk
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload apk debug
        uses: actions/upload-artifact@v5
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug

  release_app_packages:
    if: ${{ github.event.inputs.buildType == 'Release' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > keystore.jks

      - name: Build bundle for ${{ github.ref_name }}
        if: github.event.inputs.buildBundle == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Build apk for ${{ github.ref_name }}
        if: github.event.inputs.buildApk == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload bundle release
        uses: actions/upload-artifact@v5
        if: github.event.inputs.buildBundle == 'true'
        with:
          name: bundle-release-${{ github.event.inputs.versionName }}
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload apk release
        uses: actions/upload-artifact@v5
        if: github.event.inputs.buildApk == 'true'
        with:
          name: apk-release-${{ github.event.inputs.versionName }}
          path: app/build/outputs/apk/release/app-release.apk
