version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/libs.versions.toml"
    schedule:
      interval: "monthly"
    groups:
      all-gradle-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch", "major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns: [ "*" ]
